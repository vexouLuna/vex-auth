# The service, its database and the migrate step, for running it anywhere. Settings come from .env
# (see .env.example) and secrets from secrets/ (see secrets.example/); auth_database_url should point at
# the `db` service below.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: vex_auth
      POSTGRES_PASSWORD_FILE: /run/secrets/auth_db_password
      POSTGRES_DB: vex_auth
    secrets: [auth_db_password]
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vex_auth"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  # Migrations are their own step: it runs to completion before the service starts.
  migrate:
    image: ${AUTH_IMAGE:-ghcr.io/vexouluna/vex-auth:main}
    command: ["db", "upgrade"]
    env_file: .env
    secrets: [auth_database_url]
    depends_on:
      db:
        condition: service_healthy

  auth:
    image: ${AUTH_IMAGE:-ghcr.io/vexouluna/vex-auth:main}
    env_file: .env
    secrets: [auth_database_url, auth_twitch_client_secret, auth_token_key, auth_clients]
    ports:
      - "127.0.0.1:8090:8090"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  db:

secrets:
  auth_db_password: { file: ./secrets/auth_db_password }
  auth_database_url: { file: ./secrets/auth_database_url }
  auth_twitch_client_secret: { file: ./secrets/auth_twitch_client_secret }
  auth_token_key: { file: ./secrets/auth_token_key }
  auth_clients: { file: ./secrets/auth_clients }
