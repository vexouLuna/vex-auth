[project]
name = "vex-auth"
version = "0.5.0"
description = "One Twitch sign-in for every vexoul.net site, and the per-user data behind it (watch progress)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.142.2",
  "uvicorn[standard]>=0.54.0",
  "sqlalchemy[asyncio]>=2.1.3",
  "psycopg[binary]>=3.3.6",
  "alembic>=1.20.0",
  "pydantic-settings>=2.16.0",
  "httpx>=0.28.1",
  "cryptography>=50.0.2",
  "structlog>=26.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "pytest-asyncio>=1.4.0", "ruff>=0.16.10", "mypy>=2.4.0"]

[project.scripts]
vex-auth = "vex_auth.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vex_auth"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.uv]
required-version = ">=0.5"

[tool.ruff]
extend = ".conventions/ruff.toml"

[tool.mypy]
files = ["src", "tests"]
python_version = "3.13"
strict = true
ignore_missing_imports = true
